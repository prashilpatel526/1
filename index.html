<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PROX.AI Master Engine</title>
    <style>
        :root {
            --bg-color: #0b0e14;
            --panel-bg: #131722;
            --accent-crypto: #00ffcc;
            --accent-us: #3b82f6;
            --accent-in: #ff9933;
            --text-main: #ffffff;
            --text-muted: #848e9c;
            --border-color: #2a2e39;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 10px;
        }

        /* Ticker Bar */
        .ticker-bar {
            background: #1e222d;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            font-size: 12px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
            white-space: nowrap;
        }

        .ticker-badge {
            background: rgba(0, 255, 204, 0.1);
            color: var(--accent-crypto);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .ticker-text {
            color: var(--text-muted);
            animation: marquee 20s linear infinite;
        }

        /* Market Selector Buttons */
        .market-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .market-btn {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .market-btn.active-crypto {
            border-color: var(--accent-crypto);
            color: var(--accent-crypto);
            background: rgba(0, 255, 204, 0.05);
        }

        .market-btn.active-us {
            border-color: var(--accent-us);
            color: var(--accent-us);
            background: rgba(59, 130, 246, 0.05);
        }

        .market-btn.active-in {
            border-color: var(--accent-in);
            color: var(--accent-in);
            background: rgba(255, 153, 51, 0.05);
        }

        /* Main Header Panel */
        .header-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .status-dots {
            display: flex;
            gap: 6px;
        }

        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
        }

        .dot-red { background: #ef4444; }
        .dot-yellow { background: #f59e0b; }
        .dot-green { background: #10b981; }

        .brand-title {
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--accent-crypto);
            font-size: 14px;
        }

        .time-display {
            font-size: 12px;
            color: var(--text-muted);
        }

        .settings-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
        }

        /* Dashboard Core Panel */
        .dashboard-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 15px;
        }

        .logo-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .shield-logo {
            background: rgba(59, 130, 246, 0.1);
            color: var(--accent-us);
            border: 1px solid var(--accent-us);
            padding: 8px 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .asset-tabs {
            display: flex;
            gap: 6px;
            background: var(--bg-color);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .asset-tab {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        .asset-tab.active {
            background: #2a2e39;
            color: var(--text-main);
        }

        .gold-tab {
            background: rgba(245, 158, 11, 0.1) !important;
            color: #f59e0b !important;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .price-sync-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 15px;
        }

        .price-box {
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            border-radius: 8px;
        }

        .price-label {
            font-size: 10px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .price-val {
            font-size: 16px;
            font-weight: bold;
            color: var(--accent-crypto);
            margin-top: 2px;
        }

        .sync-btn {
            background: rgba(0, 255, 204, 0.1);
            border: 1px solid var(--accent-crypto);
            color: var(--accent-crypto);
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <!-- Live Ticker Bar -->
    <div class="ticker-bar">
        <span class="ticker-badge">LIVE FEED</span>
        <span class="ticker-text">⚡ Whale Alert: 8,500 BTC moved to exchange | 🇺🇸 US CPI Data Release in 2 hours | 🇮🇳 Nifty tracking key support zone</span>
    </div>

    <!-- Market Selector -->
    <div class="market-selector">
        <button class="market-btn active-crypto">⚡ Crypto Market</button>
        <button class="market-btn">🇺🇸 US Market</button>
        <button class="market-btn">🇮🇳 Indian Market</button>
    </div>

    <!-- Master Header -->
    <div class="header-panel">
        <div style="display: flex; align-items: center; gap: 12px;">
            <div class="status-dots">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
            </div>
            <span class="brand-title">PROXAI MASTER</span>
        </div>
        <div class="time-display" id="utc-time">20:28:17 IST</div>
        <button class="settings-btn">⚙️ Settings</button>
    </div>

    <!-- Dashboard Core -->
    <div class="dashboard-panel">
        <div class="logo-row">
            <div class="shield-logo">🛡️ PROX.AI</div>
            <div class="asset-tabs">
                <button class="asset-tab active">BTC</button>
                <button class="asset-tab">ETH</button>
                <button class="asset-tab">SOL</button>
                <button class="asset-tab">XRP</button>
                <button class="asset-tab gold-tab">GOLD (XAU)</button>
            </div>
        </div>

        <div class="price-sync-row">
            <div class="price-box">
                <div class="price-label">BTCUSDT SPOT</div>
                <div class="price-val">$64,982.00</div>
            </div>
            <button class="sync-btn">
                🔄 SYNC TIMELINES
            </button>
        </div>
    </div>

    <script>
        // Live Clock updater
        setInterval(() => {
            const d = new Date();
            document.getElementById('utc-time').innerText = d.toLocaleTimeString() + ' IST';
        }, 1000);
    </script>
</body>
</html>
