<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0b0e11; color: #eaecef; font-family: sans-serif; }
        .glass { background: rgba(18, 20, 25, 0.95); border: 1px solid #2d3139; }
        .tab-active { border-bottom: 2px solid #f59e0b; color: #f59e0b; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- TOP: INSTITUTIONAL COMMAND BAR -->
    <div class="glass p-3 flex justify-between items-center px-4">
        <div class="flex items-center gap-4">
            <h1 class="font-black text-amber-500">ProX</h1>
            <div class="h-4 w-[1px] bg-gray-700"></div>
            <div class="text-[10px] text-gray-400">SENTIMENT: <span class="text-green-500">68% BULLISH</span></div>
        </div>
        <div class="bg-amber-500/10 text-amber-500 px-3 py-1 rounded text-[10px] font-bold border border-amber-500/20">
            ⚡ HTF LONG EXPANSION ACTIVE
        </div>
    </div>

    <!-- UPPER DATA GRID (FROM NEW DESIGN) -->
    <div class="p-4 grid grid-cols-3 gap-3">
        <div class="glass p-3 rounded-xl border border-green-900/30">
            <div class="text-[9px] text-gray-500">ENTRY ZONE</div>
            <div class="text-lg font-bold text-white">$71,900.15</div>
        </div>
        <div class="glass p-3 rounded-xl border border-green-900/30">
            <div class="text-[9px] text-green-500">TARGET (TP)</div>
            <div class="text-lg font-bold text-green-400">$73,009.14</div>
        </div>
        <div class="glass p-3 rounded-xl border border-red-900/30">
            <div class="text-[9px] text-red-500">STOP LOSS (SL)</div>
            <div class="text-lg font-bold text-red-400">$71,350.00</div>
        </div>
    </div>

    <!-- MAIN CHART AREA (FROM ORIGINAL DESIGN) -->
    <div class="flex-1 px-4">
        <div class="glass rounded-xl h-[300px] flex items-center justify-center text-gray-600">
            [ TRADINGVIEW CHART INTEGRATION HERE ]
        </div>
        
        <!-- WHALE ENGINE -->
        <div class="mt-3 glass p-4 rounded-xl border-l-4 border-green-500">
            <div class="text-green-500 font-bold text-xs uppercase italic">⚡ Institutional Whale Volume Engine</div>
            <div class="text-white text-xs mt-1">WHALE FOOTPRINT: Heavy Institutional Accumulation Detected!</div>
        </div>

        <!-- BUY/SELL BUTTONS -->
        <div class="grid grid-cols-2 gap-3 mt-4">
            <button class="bg-green-500 text-black font-bold py-3 rounded-lg text-sm">BUY / LONG</button>
            <button class="bg-red-500 text-white font-bold py-3 rounded-lg text-sm">SELL / SHORT</button>
        </div>
    </div>

    <!-- FOOTER NAV -->
    <div class="glass border-t border-gray-800 p-3 flex justify-around text-[10px] text-gray-500">
        <div class="tab-active text-amber-500 font-bold">Chart</div>
        <div>ICT/CRT</div>
        <div>Scanner</div>
        <div>Plan</div>
        <div>Vault</div>
    </div>

</body>
</html>
